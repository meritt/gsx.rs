name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    concurrency:
      group: ci-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Setup
        run: |
          rustup toolchain install
          declared="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [[ "$(rustc --version)" != "rustc $declared "* ]]; then
            echo "::error::effective Rust version does not match rust-toolchain.toml"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        env:
          CARGO_BUILD_WARNINGS: deny
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --workspace --all-targets --locked
          cargo clippy -p gsx-core -p gsx-wasm --locked --target wasm32-unknown-unknown
          cargo doc --workspace --no-deps --locked

      - name: Policy
        run: cargo xtask header --check

      - name: Install
        env:
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$2" "$1"
          }
          mkdir -p "$RUNNER_TEMP/bin"
          deny="$RUNNER_TEMP/cargo-deny.tar.gz"
          fetch https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz "$deny"
          echo "$CARGO_DENY_SHA256  $deny" | sha256sum -c - > /dev/null
          tar -xzf "$deny" -C "$RUNNER_TEMP/bin" --strip-components 1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          leaks="$RUNNER_TEMP/gitleaks.tar.gz"
          fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz "$leaks"
          echo "$GITLEAKS_SHA256  $leaks" | sha256sum -c - > /dev/null
          tar -xzf "$leaks" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Audit
        run: cargo deny --locked check

      - name: Secrets
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          gitleaks dir --redact --no-banner --timeout 300 \
            --max-target-megabytes 64 "$RUNNER_TEMP/source"

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        run: cargo package -p gsx-core --locked

      - name: Setup
        env:
          MIRI_TOOLCHAIN: nightly-2026-11-01
        run: |
          rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src
          echo "MIRI_TOOLCHAIN=$MIRI_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Soundness
        run: cargo "+$MIRI_TOOLCHAIN" miri test -p gsx-ffi --lib --locked

      - name: Save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.restore.outputs.cache-primary-key }}

  build:
    name: Build
    needs: wheel
    if: ${{ github.ref_type != 'tag' }}
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        run: rustup toolchain install

      - name: Setup
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: packages/npm
          node-version-file: ../../.nvmrc
          install: false

      - name: Restore
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/tools/
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install
        env:
          BINARYEN_SHA256: ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8
        run: |
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$archive" \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-arm64-macos.tar.gz
          echo "$BINARYEN_SHA256  $archive" | shasum -a 256 -c - > /dev/null
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
          bindgen="$(cargo pkgid --locked -p wasm-bindgen)"
          cargo install wasm-bindgen-cli --version "=${bindgen##*@}" --locked --root target/tools

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: ${{ runner.temp }}/wheels
          merge-multiple: true

      - name: Package
        run: |
          cargo xtask dist "$RUNNER_TEMP/release" --wheels "$RUNNER_TEMP/wheels"
          node packages/npm/test/startup.mjs packages/npm/dist/gsx.js

      - name: Upload
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/tools/
          key: ${{ steps.restore.outputs.cache-primary-key }}

  wheel:
    name: Wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux_2_28_x86_64
            runner: ubuntu-26.04
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.16-1@sha256:1e7b8460ad8fb3fb0fbe1cd818845159ac896b4fd17452d56e892c291f3b97a8
            rustup: x86_64-unknown-linux-gnu
            rustup-sha256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
          - platform: manylinux_2_28_aarch64
            runner: ubuntu-26.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.16-1@sha256:b873ffc316ffe8a154e3dc4872871de2ebd170db4876c8bbd983d42ff320001e
            rustup: aarch64-unknown-linux-gnu
            rustup-sha256: a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697
          - platform: musllinux_1_2_x86_64
            runner: ubuntu-26.04
            image: quay.io/pypa/musllinux_1_2_x86_64:2026.10.16-1@sha256:915d73c75b4551f98fd7b12de655ef2e27419a6441ea07472b6e25e0d868d18d
            rustup: x86_64-unknown-linux-musl
            rustup-sha256: 2ba97d668c06dc4b1884f2a3fa6f4cf14b9bd0c1db379af7e4f87a705ff19edd
          - platform: musllinux_1_2_aarch64
            runner: ubuntu-26.04-arm
            image: quay.io/pypa/musllinux_1_2_aarch64:2026.10.16-1@sha256:75a9ccd28ccc0abda65e462133f6e324943354e4e4936b51ba7c2ddc98352f86
            rustup: aarch64-unknown-linux-musl
            rustup-sha256: 7fdbb23acf6495efee2e371580c52b365917551b4835090a225c44ac30915235
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    concurrency:
      group: ci-wheel-${{ matrix.platform }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Replay
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          RUSTUP: ${{ matrix.rustup }}
          RUSTUP_SHA256: ${{ matrix.rustup-sha256 }}
        run: |
          docker run --rm --volume "$PWD:/io" --workdir /io \
            --env PLATFORM --env RUSTUP --env RUSTUP_SHA256 --env GSX_PYTHON=/opt/python/cp314-cp314/bin/python \
            "$IMAGE" sh -euc '
              command -v zip > /dev/null || { command -v apk > /dev/null && apk add --quiet zip || dnf install --assumeyes --quiet zip; }
              curl --fail --silent --show-error --location --proto "=https" --tlsv1.2 --output /tmp/rustup-init \
                "https://static.rust-lang.org/rustup/archive/1.29.2/$RUSTUP/rustup-init"
              echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c - > /dev/null
              chmod +x /tmp/rustup-init
              /tmp/rustup-init -y --quiet --profile minimal --default-toolchain none --no-modify-path
              PATH="$HOME/.cargo/bin:$PATH"
              rustup toolchain install
              cargo xtask replay python
              wheel="$(ls packages/python/dist/*.whl)"
              case "$wheel" in
                *-py3-none-"$PLATFORM".whl) echo "$wheel" ;;
                *) echo "::error::unexpected wheel name $wheel"; exit 1 ;;
              esac
            '

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: packages/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  instructions:
    name: Instructions
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    concurrency:
      group: ci-instructions-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      CALLGRIND_LIMITS: ir=1%
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: instructions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: instructions-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Setup
        run: |
          rustup toolchain install
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
          gungraun="$(cargo pkgid --locked -p gungraun)"
          cargo install --locked "gungraun-runner@${gungraun##*@}" --root target/tools
          echo "$GITHUB_WORKSPACE/target/tools/bin" >> "$GITHUB_PATH"
          echo "GUNGRAUN_HOME=$RUNNER_TEMP/gungraun" >> "$GITHUB_ENV"

      - name: Baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}"; then
            BASE="$(git rev-parse --verify --quiet 'HEAD^' || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "no parent commit to compare with"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          if [ ! -f crates/gsx-core/benches/instructions.rs ]; then
            echo "no instruction benches at $BASE"
            exit 0
          fi
          rustup toolchain install
          cargo bench -p gsx-core --bench instructions --locked -- --save-baseline=base

      - name: Compare
        run: |
          status=0
          cargo bench -p gsx-core --bench instructions --locked -- --baseline=base --callgrind-limits="$CALLGRIND_LIMITS" 2>&1 | tee "$RUNNER_TEMP/instructions.log" || status=$?
          if [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          {
            echo "### Instructions above ${CALLGRIND_LIMITS#ir=} of the base commit"
            echo
            echo '```text'
            sed -n '/^Regressions:/,/^Gungraun result:/p' "$RUNNER_TEMP/instructions.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Instructions::Instruction counts grew by more than ${CALLGRIND_LIMITS#ir=}; the job summary lists the benchmarks"

      - name: Save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.restore.outputs.cache-primary-key }}

  fuzz:
    name: Fuzz
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    concurrency:
      group: ci-fuzz-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      FUZZ_TOOLCHAIN: nightly-2026-11-01
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/tools/
            fuzz/target/
          key: fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('fuzz/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Setup
        run: |
          rustup toolchain install
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal

      - name: Install
        run: |
          cargo install --locked cargo-fuzz@0.13.2 --root target/tools
          echo "$GITHUB_WORKSPACE/target/tools/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          cargo "+$FUZZ_TOOLCHAIN" fuzz build

      - name: Fuzz
        run: |
          cargo "+$FUZZ_TOOLCHAIN" fuzz run parse -- -max_len=4096 -max_total_time=60
          cargo "+$FUZZ_TOOLCHAIN" fuzz run project -- -max_total_time=60

      - name: Save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/tools/
            fuzz/target/
          key: ${{ steps.restore.outputs.cache-primary-key }}
