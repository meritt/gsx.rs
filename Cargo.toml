[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Alexey Simonenko <alexey@simonenko.dev>"]
repository = "https://github.com/meritt/gsx.rs"
publish = false

[workspace.dependencies]
gsx-core = { path = "crates/gsx-core" }
url = "2.5.8"
icu_normalizer = { version = "~2.2.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "~2.2.0", default-features = false, features = ["compiled_data"] }
wasm-bindgen = "=0.2.130"
serde_json = "1.0.154"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
gungraun = "0.20.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
cbindgen = { version = "0.29.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
option_option = "allow"
ref_option = "allow"
unnecessary_wraps = "allow"
verbose_bit_mask = "allow"
unreadable_literal = "allow"

[profile.release]
lto = true
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
