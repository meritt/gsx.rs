[package]
name = "gsx-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
gsx-core = { path = "../crates/gsx-core" }
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project"
path = "fuzz_targets/project.rs"
test = false
doc = false
bench = false
